name: "Dotfiles Validation"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Just and GNU Stow
        run: brew install just stow

      - name: Validate Shell Syntax
        run: |
          bash -n bootstrap.sh
          bash -n scripts/*.sh
          bash -n scripts/awdl
          zsh -n stow/zsh/.zshrc
          zsh -n stow/zsh/.zshenv

      - name: Validate LaunchAgent Plists
        run: plutil -lint stow/launchd/Library/LaunchAgents/*.plist

      - name: Validate Justfile
        run: |
          just --fmt --check
          just --list

      - name: Simulate Stow
        run: |
          SANDBOX=$(mktemp -d)
          (cd stow && stow -t "$SANDBOX" --restow *)
          rm -rf "$SANDBOX"
